services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    restart: always
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    ports:
      - "8883:1883"
      - "9001:9001"
    mem_limit: 3g
    cpus: 3.0
  db:
    container_name: postgres-db
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: taxiAssignmentSystem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d taxiAssignmentSystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - db

  gmaps-backend-backend-simulation:
    container_name: gmaps-backend-backend-simulation
    build:
      context: ./Gmaps_bakend_simulation
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-rate-backend-simulation:
    container_name: order-rate-backend-simulation
    build:
      context: ./Order_rate_simulation_backend
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-rate-backend-simulation-60-bases:
    container_name: order-rate-backend-simulation-60-bases
    build:
      context: ./Order_rate_simulation_backend_60_base
      dockerfile: Dockerfile
    ports:
      - "5022:5022"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5022/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-ta:
    container_name: backend-ta
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "5010:5010"
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy
      gmaps-backend-backend-simulation:
        condition: service_healthy
      order-rate-backend-simulation:
        condition: service_healthy
      osrm:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://appuser:secret123@db:5432/taxiAssignmentSystem
      MQTT_BROKER: mosquitto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 4.0
    mem_limit: 4g

  osrm-prep:
    image: osrm/osrm-backend
    container_name: osrm-prep
    volumes:
      - ./osrm-data:/data
    entrypoint: /bin/bash -c "
      osrm-extract -p /opt/car.lua /data/jawa-latest.osm.pbf &&
      osrm-partition /data/jawa-latest.osrm &&
      osrm-customize /data/jawa-latest.osrm
      "

  osrm:
    image: osrm/osrm-backend
    container_name: osrm
    ports:
      - "5003:5003"
    volumes:
      - ./osrm-data:/data
    command: >
      osrm-routed --max-table-size=100000 --algorithm mld --port 5003 /data/jawa-latest.osrm
    depends_on:
      - osrm-prep

volumes:
  config:
  data:
  log:
  pgdata:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
